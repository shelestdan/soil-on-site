<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a1f3d;
      --blue: #0d4f86;
      --bg: #eef7ff;
      --line: #c7ddf0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 72% 18%, rgba(115, 194, 246, .32), transparent 34%),
        linear-gradient(135deg, #f6fbff 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    main {
      width: min(640px, 100%);
      padding: clamp(30px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 22px 70px rgba(10, 48, 88, .14);
    }

    .mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 6vw, 52px);
      line-height: .98;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #3c5268;
      font-size: clamp(18px, 2vw, 21px);
      line-height: 1.55;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      margin-top: 28px;
      padding: 0 28px;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">&check;</div>
    <h1>Enquiry received</h1>
    <p>Thank you. We will review your details and get back to you.</p>
    <a href="/">Back to Soil On Site</a>
  </main>
</body>
</html>
